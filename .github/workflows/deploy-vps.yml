name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Verify & Package Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify dependencies, formatting, and types
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test:security
          npm audit --omit=dev --audit-level=high || true

      - name: Package committed source
        run: git archive --format=tar.gz --output=release.tar.gz "$GITHUB_SHA"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release.tar.gz
          retention-days: 1

  deploy-new-server:
    name: Deploy to Server Baru (27.124.75.241)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/vps-deploy.sh
          sparse-checkout-cone-mode: false

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bundle

      - name: Deploy to Server Baru
        env:
          TARGET_HOST: '27.124.75.241'
          TARGET_PORT: '9393'
          TARGET_USER: 'admin'
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "VPS_SSH_KEY is not configured"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$TARGET_PORT" -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "==> [Pre-Deploy] Memastikan PM2 aktif:"
          ssh -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "
            pm2 resurrect || true
            pm2 restart gis-app || pm2 start /home/admin/gis-deploy/current/ecosystem.config.cjs --update-env || true
            pm2 save || true
          "

          ssh -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "mkdir -p /home/admin/gis-deploy/incoming"
          scp -P "$TARGET_PORT" release.tar.gz "$TARGET_USER@$TARGET_HOST:/home/admin/gis-deploy/incoming/$GITHUB_SHA.tar.gz"
          scp -P "$TARGET_PORT" scripts/vps-deploy.sh "$TARGET_USER@$TARGET_HOST:/home/admin/gis-deploy/vps-deploy.sh"
          ssh -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "chmod 700 /home/admin/gis-deploy/vps-deploy.sh && /home/admin/gis-deploy/vps-deploy.sh /home/admin/gis-deploy/incoming/$GITHUB_SHA.tar.gz $GITHUB_SHA" || {
            echo "⚠️ vps-deploy.sh exit non-zero, memastikan PM2 tetap aktif:"
            ssh -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "
              pm2 resurrect || true
              pm2 restart gis-app || pm2 start /home/admin/gis-deploy/current/ecosystem.config.cjs --update-env || true
              pm2 save || true
            "
            exit 1
          }

          echo "==> [Post-Deploy] Verifikasi PM2 dan Port 3000:"
          ssh -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "
            pm2 status
            curl -I --max-time 5 http://127.0.0.1:3000/ || true
          "

  deploy-old-server:
    name: Deploy to Server Lama (103.179.57.4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Check out deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/vps-deploy.sh
          sparse-checkout-cone-mode: false

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bundle

      - name: Deploy to Server Lama
        env:
          TARGET_HOST: ${{ secrets.VPS_HOST || '103.179.57.4' }}
          TARGET_PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET_USER: ${{ secrets.VPS_USER || 'admin' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "VPS_SSH_KEY is not configured"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$TARGET_PORT" -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "mkdir -p /home/admin/gis-deploy/incoming"
          scp -P "$TARGET_PORT" release.tar.gz "$TARGET_USER@$TARGET_HOST:/home/admin/gis-deploy/incoming/$GITHUB_SHA.tar.gz"
          scp -P "$TARGET_PORT" scripts/vps-deploy.sh "$TARGET_USER@$TARGET_HOST:/home/admin/gis-deploy/vps-deploy.sh"
          ssh -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "chmod 700 /home/admin/gis-deploy/vps-deploy.sh && /home/admin/gis-deploy/vps-deploy.sh /home/admin/gis-deploy/incoming/$GITHUB_SHA.tar.gz $GITHUB_SHA"
